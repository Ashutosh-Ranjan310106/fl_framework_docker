networks:
  fl_network:
    driver: bridge

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: fl_server:latest
    container_name: fl_server
    ports:
      - "8080:8080"
      - "8000:8000"
    environment:
      - EXPERIMENT_CONFIG_PATH=experiments/default.yaml
      - SERVER_ADDRESS=0.0.0.0:8080
      - MONITORING_URL=http://127.0.0.1:8000
      - MONITORING_DB_PATH=/app/results/monitoring.db
      - ENABLE_EMBEDDED_MONITOR=true
      - RESULTS_DIR=/app/results
      - LOG_DIR=/app/logs
      - NUM_ROUNDS=${NUM_ROUNDS:-3}
      - MIN_FIT_CLIENTS=${MIN_FIT_CLIENTS:-2}
      - MIN_AVAILABLE_CLIENTS=${MIN_AVAILABLE_CLIENTS:-2}
      - CHECKPOINT_DIR=/app/models/checkpoints
      - TEST_DATA_PATH=/app/datasets/original/cifar10/test/data.pt
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./results:/app/results
      - ./datasets/original:/app/datasets/original:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 4s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - fl_network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  client_001:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: fl_client:latest
    container_name: fl_client_001
    depends_on:
      server:
        condition: service_started
    environment:
      - CLIENT_ID=client_001
      - CLIENT_ROLE=honest
      - PARTITION_PATH=/app/data
      - SERVER_ADDRESS=${SERVER_ADDRESS:-server:8080}
      - MONITORING_URL=${MONITORING_URL:-http://server:8000}
      - LOCAL_EPOCHS=2
      - BATCH_SIZE=32
      - LEARNING_RATE=0.001
      - LOG_DIR=/app/logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./datasets/partitions/cifar10/iid/clients_10_seed_42/client_001:/app/data:ro
      - ./logs/clients/client_001:/app/logs
    networks:
      - fl_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

